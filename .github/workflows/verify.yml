name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - codex/dashboard-optimization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://delegate:delegate@127.0.0.1:5432/delegate_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and validate Prisma Client
        run: pnpm db:generate && pnpm db:validate

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Test workspace
        run: pnpm exec turbo run test --concurrency=1

      - name: Build applications
        run: pnpm build

  owner-settings-postgres:
    name: Owner Settings PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Owner Settings migration and concurrency gate
        run: pnpm test:postgres:owner-settings
