services:
  migrate:
    command: >
      sh -lc "pnpm db:generate && pnpm db:deploy && pnpm db:seed"
    volumes:
      - ./prisma:/app/prisma:ro

  dashboard:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3001
      LOGTO_BACKCHANNEL_ENDPOINT: ${LOGTO_BACKCHANNEL_ENDPOINT:-http://host.docker.internal:3301}
      DELEGATE_AUTH_SESSION_SECRET: ${DELEGATE_AUTH_SESSION_SECRET:-delegate-local-auth-session-secret-change-me}
      DELEGATE_DASHBOARD_AUTH_MODE: required
      DELEGATE_AUTH_DEV_LOGIN: "true"
      DELEGATE_LOCAL_AUTH_BOOTSTRAP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -lc "pnpm db:generate && pnpm local:auth:bootstrap && exec pnpm --filter @delegate/dashboard exec next dev --turbopack -H 0.0.0.0 -p 3001"
    volumes:
      - ./apps/web/app:/app/apps/web/app:ro
      - ./apps/web/auth-guard.ts:/app/apps/web/auth-guard.ts:ro
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts:ro
      - ./apps/web/proxy.ts:/app/apps/web/proxy.ts:ro
      - ./packages/artifacts/src:/app/packages/artifacts/src:ro
      - ./packages/compute-protocol/src:/app/packages/compute-protocol/src:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
      - ./packages/openviking/src:/app/packages/openviking/src:ro
      - ./packages/registry/src:/app/packages/registry/src:ro
      - ./packages/runtime/src:/app/packages/runtime/src:ro
      - ./packages/web-data/package.json:/app/packages/web-data/package.json:ro
      - ./packages/web-data/src:/app/packages/web-data/src:ro
      - ./packages/web-ui/src:/app/packages/web-ui/src:ro
      - ./packages/web-ui/styles:/app/packages/web-ui/styles:ro
      - ./packages/workflows/src:/app/packages/workflows/src:ro
      - ./prisma/schema.prisma:/app/prisma/schema.prisma:ro
      - ./scripts/local-auth-bootstrap.ts:/app/scripts/local-auth-bootstrap.ts:ro
    healthcheck:
      start_period: 30s

  reps:
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_REPRESENTATIVE_URL: http://localhost:3002
      LOGTO_BACKCHANNEL_ENDPOINT: ${LOGTO_BACKCHANNEL_ENDPOINT:-http://host.docker.internal:3301}
      LOGTO_REPS_LEGACY_BACKCHANNEL_ENDPOINT: ${LOGTO_REPS_LEGACY_BACKCHANNEL_ENDPOINT:-http://host.docker.internal:3301}
      DELEGATE_AUTH_SESSION_SECRET: ${DELEGATE_AUTH_SESSION_SECRET:-delegate-local-auth-session-secret-change-me}
      REP_PUBLIC_CHAT_SESSION_SECRET: ${REP_PUBLIC_CHAT_SESSION_SECRET:-delegate-local-public-chat-session-secret-change-me}
      DELEGATE_AUTH_DEV_LOGIN: "true"
      NEXT_PUBLIC_ENABLE_PUBLIC_DEMOS: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -lc "pnpm db:generate && exec pnpm --filter @delegate/reps exec next dev --turbopack -H 0.0.0.0 -p 3002"
    volumes:
      - ./apps/reps/app:/app/apps/reps/app:ro
      - ./apps/reps/instrumentation.ts:/app/apps/reps/instrumentation.ts:ro
      - ./apps/reps/next.config.ts:/app/apps/reps/next.config.ts:ro
      - ./apps/reps/proxy.ts:/app/apps/reps/proxy.ts:ro
      - ./apps/reps/public:/app/apps/reps/public:ro
      - ./packages/artifacts/src:/app/packages/artifacts/src:ro
      - ./packages/compute-protocol/src:/app/packages/compute-protocol/src:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
      - ./packages/lifecycle-hooks/src:/app/packages/lifecycle-hooks/src:ro
      - ./packages/model-runtime/src:/app/packages/model-runtime/src:ro
      - ./packages/openviking/src:/app/packages/openviking/src:ro
      - ./packages/registry/src:/app/packages/registry/src:ro
      - ./packages/runtime/src:/app/packages/runtime/src:ro
      - ./packages/web-data/package.json:/app/packages/web-data/package.json:ro
      - ./packages/web-data/src:/app/packages/web-data/src:ro
      - ./packages/web-ui/src:/app/packages/web-ui/src:ro
      - ./packages/web-ui/styles:/app/packages/web-ui/styles:ro
      - ./packages/workflows/src:/app/packages/workflows/src:ro
      - ./prisma/schema.prisma:/app/prisma/schema.prisma:ro
    healthcheck:
      start_period: 30s

  compute-broker:
    environment:
      # Docker Desktop may map public DNS names to its 198.18/15 HTTPS egress
      # proxy. Production keeps this unset so benchmark/private ranges remain
      # blocked by the MCP SSRF boundary.
      DELEGATE_ALLOW_DOCKER_DESKTOP_MCP_DNS_PROXY: "true"

  bot:
    environment:
      TELEGRAM_WEB_RECHARGE_BASE_URL: ${TELEGRAM_WEB_RECHARGE_BASE_URL:-http://localhost:3002}
