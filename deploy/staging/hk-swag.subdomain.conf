## Delegate staging public ingress on the Hong Kong SWAG host.
## TLS terminates here. The mainland origin is reached with the filed
## tsd.rag8.cn SNI while the original Host remains available to Traefik.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name
        www.bonary.xyz
        dashboard.bonary.xyz
        delegate.bonary.xyz
        login.bonary.xyz
        login-admin.bonary.xyz
        matrix.bonary.xyz
        openviking.bonary.xyz
        api.bonary.xyz;

    include /config/nginx/ssl.conf;

    client_max_body_size 100m;

    location / {
        include /config/nginx/proxy.conf;
        proxy_buffering off;
        proxy_ssl_server_name on;
        proxy_ssl_name tsd.rag8.cn;
        proxy_pass https://81.70.105.92;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pay.bonary.xyz;

    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    location = /api/payments/wechat/notify {
        if ($request_method != POST) { return 404; }

        include /config/nginx/proxy.conf;
        proxy_ssl_server_name on;
        proxy_ssl_name tsd.rag8.cn;
        proxy_pass https://81.70.105.92;
    }

    location = /api/payments/wechat/refund-notify {
        if ($request_method != POST) { return 404; }

        include /config/nginx/proxy.conf;
        proxy_ssl_server_name on;
        proxy_ssl_name tsd.rag8.cn;
        proxy_pass https://81.70.105.92;
    }

    location / {
        return 404;
    }
}
