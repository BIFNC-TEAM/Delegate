## Callback-only HTTPS ingress for local WeChat Pay canary testing.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pay.bonary.xyz;

    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    location = /api/payments/wechat/notify {
        if ($request_method != POST) { return 404; }

        include /config/nginx/proxy.conf;
        proxy_pass http://172.19.23.197:4303;
    }

    location = /api/payments/wechat/refund-notify {
        if ($request_method != POST) { return 404; }

        include /config/nginx/proxy.conf;
        proxy_pass http://172.19.23.197:4303;
    }

    location / {
        return 404;
    }
}
