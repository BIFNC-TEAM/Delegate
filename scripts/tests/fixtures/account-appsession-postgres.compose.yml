services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: account_session_fixture_only
      POSTGRES_DB: delegate_account_session_fixture
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d delegate_account_session_fixture
      interval: 1s
      timeout: 2s
      retries: 30
